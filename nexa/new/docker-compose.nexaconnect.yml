# ──────────────────────────────────────────────────────────────────────
#  OmniRoute — NexaConnect PRODUCTION profile (hardened, minimal)
# ──────────────────────────────────────────────────────────────────────
#
#  Purpose: the deployment profile NexaConnect should use in production —
#  isolated from the local power-user `docker-compose.yml` (whose `cli`
#  profile mounts /var/run/docker.sock and host agent config dirs
#  ~/.codex, ~/.claude, ~/.cursor, etc. — high-trust local conveniences
#  that must NEVER ship to production). This profile deliberately:
#
#    • builds `runner-base` (the SMALLEST image — no Playwright/Chromium),
#      which is sufficient for API-key providers (which is all NexaConnect
#      needs; it talks to OmniRoute over the OpenAI-compatible HTTP API).
#      If you actually need web-cookie providers, switch target to
#      runner-web — but do NOT reach for runner-cli in production.
#    • mounts ONLY a named data volume — NO docker.sock, NO host config
#      mounts, NO broad RW project mount.
#    • enforces REQUIRE_API_KEY=true. Combined with the run-standalone
#      startup guard, a public (0.0.0.0) production bind refuses to boot
#      unless API-key enforcement is on — so this can't be misconfigured
#      into an open, unauthenticated gateway.
#
#  Usage:
#    docker compose -f docker-compose.nexaconnect.yml up -d --build
#    docker compose -f docker-compose.nexaconnect.yml logs -f
#    docker compose -f docker-compose.nexaconnect.yml down
#
#  Provide secrets via an env file that is NOT committed (e.g. .env.nexaconnect):
#    docker compose --env-file .env.nexaconnect -f docker-compose.nexaconnect.yml up -d
# ──────────────────────────────────────────────────────────────────────

services:
  redis:
    image: redis:8.6.2-alpine
    container_name: omniroute-nexaconnect-redis
    restart: unless-stopped
    volumes:
      - nexaconnect-redis-data:/data
    command: redis-server --save 60 1 --loglevel warning
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  omniroute:
    container_name: omniroute-nexaconnect
    depends_on:
      redis:
        condition: service_healthy
    build:
      context: .
      # Smallest production image (no Chromium). API-key providers only.
      target: runner-base
    image: omniroute:nexaconnect
    restart: unless-stopped
    stop_grace_period: 40s
    # env_file supplies provider credentials — keep it OUT of git.
    env_file: .env.nexaconnect
    environment:
      - NODE_ENV=production
      # HARD requirement for any public/NexaConnect-connected deployment. The
      # run-standalone startup guard refuses a non-loopback prod bind without it.
      - REQUIRE_API_KEY=true
      # The dashboard live-events WebSocket is a local operator convenience, not
      # part of NexaConnect's HTTP-API integration. Disable it in production so
      # there is no phantom ws://…:20129 connection noise (report finding #6).
      - OMNIROUTE_ENABLE_LIVE_WS=0
      - PORT=${PORT:-20128}
      - DASHBOARD_PORT=${DASHBOARD_PORT:-${PORT:-20128}}
      - API_PORT=${API_PORT:-20129}
      - API_HOST=${API_HOST:-0.0.0.0}
      - HOSTNAME=0.0.0.0
      - DATA_DIR=/app/data
    ports:
      - "${NEXACONNECT_DASHBOARD_PORT:-28128}:${DASHBOARD_PORT:-${PORT:-20128}}"
      - "${NEXACONNECT_API_PORT:-28129}:${API_PORT:-20129}"
    # ONLY a named data volume. No docker.sock. No host config mounts.
    volumes:
      - nexaconnect-data:/app/data
    healthcheck:
      test: ["CMD", "node", "healthcheck.mjs"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  nexaconnect-data:
    name: omniroute-nexaconnect-data
  nexaconnect-redis-data:
    name: omniroute-nexaconnect-redis-data
