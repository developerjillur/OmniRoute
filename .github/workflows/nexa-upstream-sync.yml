# NexaLance living-fork — automated upstream sync.
# Runs the nexa-sync orchestrator on a schedule: merges diegosouzapw/OmniRoute
# into an isolated sandbox, validates against our customization regression tests,
# and EITHER opens a ready-to-review PR (conflicts / validation failures) OR a
# green auto-mergeable PR (clean + validated). Never force-pushes; never touches
# upstream. Enable once the fork exists (Settings → Actions → enable).
name: nexa-upstream-sync

on:
  schedule:
    - cron: "17 6 * * *" # daily 06:17 UTC — catch new upstream releases
  workflow_dispatch: {} # manual "sync now" button

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: nexa-upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout our fork (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: nexalance # our production branch

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/diegosouzapw/OmniRoute.git || true
          git fetch upstream main

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install deps (for validation)
        run: npm ci --no-audit --no-fund

      - name: Run upstream sync (sandbox merge + validate)
        id: sync
        run: |
          set +e
          node scripts/nexa-sync/nexa-sync.mjs --keep
          echo "code=$?" >> "$GITHUB_OUTPUT"
          # Read the orchestrator's precise status so downstream steps can tell
          # "up-to-date" (nothing to do) apart from "clean-validated" (branch to PR).
          STATUS=$(node -e 'try{process.stdout.write((require("./.nexa/last-sync.json").status)||"")}catch(e){}')
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
        continue-on-error: true

      - name: Publish report to job summary
        if: always()
        run: |
          REPORT=$(ls -t .nexa/reports/*.md 2>/dev/null | head -1)
          if [ -n "$REPORT" ]; then cat "$REPORT" >> "$GITHUB_STEP_SUMMARY"; fi

      # Clean + validated (a real new-upstream merge, branch exists) → push it and
      # open a PR. Gated on status, NOT exit code: the orchestrator also exits 0
      # when already up-to-date, in which case there is no branch and nothing to do.
      - name: Open PR (clean + validated)
        if: steps.sync.outputs.status == 'clean-validated'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          UP=$(git rev-parse --short upstream/main)
          BR="nexa/sync-$UP"
          git push -f origin "$BR" || true
          gh pr create --base nexalance --head "$BR" \
            --title "Upstream sync $UP (clean + validated ✅)" \
            --body "Automated: clean merge of diegosouzapw/OmniRoute@$UP, all customization regression tests green. Safe to merge." || true

      # Conflicts or validation failure → open an issue for a human.
      - name: Open issue (needs human resolution)
        if: steps.sync.outputs.status == 'conflicts' || steps.sync.outputs.status == 'validation-failed'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          UP=$(git rev-parse --short upstream/main)
          REPORT=$(ls -t .nexa/reports/*.md 2>/dev/null | head -1)
          gh issue create \
            --title "Upstream sync $UP needs resolution (exit ${{ steps.sync.outputs.code }})" \
            --body-file "${REPORT:-/dev/null}" || true
